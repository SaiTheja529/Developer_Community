[project]
name = "devcommons-backend"
version = "0.1.0"
description = "DevCommons API: harnesses, project ideas, knowledge hub and AI workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0.36",
    "flask-migrate>=4.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "ua-parser>=1.0",
    "httpx>=0.27",
    "openai>=1.60",
    "flask-limiter[redis]>=3.8",
    "flask-cors>=5.0",
    "gunicorn>=23.0",
    "python-json-logger>=3.2",
    "python-ulid>=3.0",
    "sentry-sdk[flask]>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM103", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
